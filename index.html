<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      NO `viewport-fit=cover`, deliberately.

      `cover` extends the web view underneath the status bar and home
      indicator. On iOS 26 the system then paints its glass treatment over
      that region, and its blur reaches *below* the status bar onto real
      content — which showed up as a smeared title with a ghost above it.
      Padding the content down did not help, because the blurred band is
      taller than the safe-area inset.

      Without `cover`, iOS keeps the web view inside the safe area and owns
      the status bar region itself, filling it from `theme-color`. Since that
      matches the app background exactly, the result still reads edge to edge
      — with nothing of ours underneath the glass to smear.

      `interactive-widget=resizes-content` asks the browser to shrink the
      layout viewport when the keyboard opens, which fixes keyboard overlap at
      the source on Chrome and Android. Safari ignores it, so the
      --keyboard-inset measurement in src/lib/keyboard.ts handles iOS.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Gymmy</title>
    <meta name="description" content="Log your sets. Build your plan. Watch the numbers go up." />

    <!-- Matches the resolved theme so the status bar never flashes the wrong colour. -->
    <meta name="theme-color" content="#F6F3EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110F" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Still required by older iOS, which ignores the standard tag above. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      `default`, not `black-translucent`. Translucent extends the web view up
      under the status bar AND forces white status-bar text, which is invisible
      against this app's light theme. `default` keeps the content below the
      status bar and lets iOS pick a legible text colour for the theme.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gymmy" />

    <script>
      // Resolve the theme before first paint. Anything later and the user gets a
      // white flash in a dark gym — the single most jarring bug a dark-first app
      // can ship. Mirrors resolveTheme() in src/app/theme.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem('gymmy.theme')
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = resolved
          document.documentElement.style.colorScheme = resolved
        } catch (_) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
