<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` is back, and it is required rather than optional.

      iOS 26+ renders an installed PWA fullscreen regardless, so content goes
      under the status bar either way. Without `cover`, `env(safe-area-inset-*)`
      reports 0 — which silently disables every inset we rely on. Removing it
      made things worse, not better.

      The top blur itself cannot be switched off; see #status-bar-cap below.

      `interactive-widget=resizes-content` asks the browser to shrink the
      layout viewport when the keyboard opens, which fixes keyboard overlap at
      the source on Chrome and Android. Safari ignores it, so the
      --keyboard-inset measurement in src/lib/keyboard.ts handles iOS.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Gymmy</title>
    <meta name="description" content="Log your sets. Build your plan. Watch the numbers go up." />

    <!-- Matches the resolved theme so the status bar never flashes the wrong colour. -->
    <meta name="theme-color" content="#F6F3EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110F" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Still required by older iOS, which ignores the standard tag above. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      `default`, not `black-translucent`. Translucent extends the web view up
      under the status bar AND forces white status-bar text, which is invisible
      against this app's light theme. `default` keeps the content below the
      status bar and lets iOS pick a legible text colour for the theme.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gymmy" />

    <script>
      // Resolve the theme before first paint. Anything later and the user gets a
      // white flash in a dark gym — the single most jarring bug a dark-first app
      // can ship. Mirrors resolveTheme() in src/app/theme.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem('gymmy.theme')
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = resolved
          document.documentElement.style.colorScheme = resolved
        } catch (_) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <!--
      The status bar cap.

      iOS 26+ paints a blur across the top of an installed web app that cannot
      be disabled, and it reaches well below the status bar onto real content.
      `theme-color`, `apple-mobile-web-app-status-bar-style` and a background
      on `<body>` all fail to stop it.

      What does work is an actual `position: fixed` element with a background
      at the very top — WebKit then treats that as the bar it blurs, and
      blurring a flat colour produces that same flat colour. Padding could
      never do this: it merely let the body background show through, and a
      background is not an element.

      Lives in the HTML rather than in React so it is painted before the app
      mounts, and never unmounts with a route change.
    -->
    <div id="status-bar-cap" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
